name: Legal watch (U.S. Virgin Islands)

# Legal-change tripwire for the U.S. Virgin Islands clause library (added 2026-11-21).
# LegiScan doesn't cover U.S. Virgin Islands, so this run reads official sites directly
# (the Legislature's bill tracker on billtracking.legvi.org) and reports what is new since the last run: see the
# sourceChecks in scripts/legal-watch/stateConfig.js and
# scripts/legal-watch/officialSources.js. It also runs the federal eCFR checks
# and the one federal LegiScan search. Never edits clause content itself -- a
# hit here means "go verify against primary text," nothing more.

on:
  schedule:
    # Monthly, day 26 at 14:00 UTC: U.S. Virgin Islands is #54 in the schedule (rule
    # and order: SCHEDULE_ORDER in scripts/legal-watch/stateConfig.js). Not held:
    # its first (self-seeding) run costs about one LegiScan query, so it can
    # share a month with a state's first run.
    - cron: "0 14 26 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = real run; dry-run = query and print findings, touch nothing; seed-baseline = real query, writes state, never emails (run once before the first real check); test-email = canned Resend test, no LegiScan call"
        type: choice
        options:
          - check
          - dry-run
          - seed-baseline
          - test-email
        default: check

permissions:
  contents: write # needed to commit the updated "already seen" state file

jobs:
  check:
    runs-on: ubuntu-latest
    # A stuck run fails after 30 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send test email only
        if: ${{ inputs.mode == 'test-email' }}
        working-directory: scripts/legal-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=VI --test-email

      - name: Run U.S. Virgin Islands legal-change check (dry-run)
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node checkCitations.js --state=VI --dry-run --verbose

      - name: Seed baseline state (writes state, never emails)
        if: ${{ inputs.mode == 'seed-baseline' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node checkCitations.js --state=VI --seed-baseline

      - name: Run U.S. Virgin Islands legal-change check
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'check' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=VI

      - name: Commit updated state, if any
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'seed-baseline' }}
        run: |
          git config user.name "legal-watch-bot"
          git config user.email "actions@github.com"
          git add scripts/legal-watch/state/VI.json
          # Re-checking `git diff --cached --quiet` on a second line to decide
          # whether to push is a bug: by then the commit has already cleared
          # the staged diff, so that check always passes and `push` never
          # runs. One conditional block instead, so push always follows a
          # real commit.
          if ! git diff --cached --quiet; then
            git commit -m "Legal watch (VI): update seen-bill state [skip ci]"
            # Each state writes to its own state/VI.json, so a concurrent
            # push from another state's workflow never touches the same file --
            # but git still rejects a non-fast-forward push if main moved in
            # the meantime (confirmed in practice: seeding all six new states
            # at once, only the first push landed, the other five failed here).
            # Retry with a rebase rather than assuming these jobs never overlap.
            attempt=1
            until git push; do
              if [ "$attempt" -ge 5 ]; then
                echo "git push failed after $attempt attempts, giving up"
                exit 1
              fi
              echo "push rejected (attempt $attempt), fetching and rebasing before retry..."
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
              sleep $((RANDOM % 10 + 1))
            done
          else
            echo "No state changes to commit."
          fi

      # GitHub's own failure emails are off; this sends the notice to the alert
      # address instead (2026-09-29). Manual dry-runs don't send one.
      - name: Email a failure notice
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'seed-baseline') }}
        working-directory: scripts/legal-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=VI --notify-failure
