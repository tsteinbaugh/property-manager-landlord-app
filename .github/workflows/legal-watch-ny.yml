name: Legal watch (New York)

# Legal-change tripwire for the New York clause library, following the same
# pattern validated as a Colorado proof of concept (see legal-watch-co.yml and
# scripts/legal-watch/checkCitations.js for the full explanation). Checks
# whether any bill has been enrolled/passed touching a statute section a
# shipped NY clause depends on (per lease-clause-citations-NY.csv), and
# emails a summary if so. Never edits clause content itself -- a hit here
# means "go verify against primary text," nothing more.

on:
  # schedule:  (held; see below)
    # Monthly, day 4 at 14:00 UTC: New York is state #32, so it shares day 4
    # with Nebraska an hour later (rule and order: SCHEDULE_ORDER in
    # scripts/legal-watch/stateConfig.js).
    # HELD until after 2027-05-04 so New York's first (self-seeding) run
    # doesn't land in a month that already has one (IL and ID in November, MO
    # and IN in December, OK in January, MI in February, IA in March, NM in
    # April, MT in May); uncomment `schedule:` above and the cron line below
    # then, and the first run is 2027-06-04 (docs/backlog.md).
    # - cron: "0 14 4 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = real run; dry-run = query and print findings, touch nothing; seed-baseline = real query, writes state, never emails (run once before the first real check); test-email = canned Resend test, no LegiScan call"
        type: choice
        options:
          - check
          - dry-run
          - seed-baseline
          - test-email
        default: check

permissions:
  contents: write # needed to commit the updated "already seen" state file

jobs:
  check:
    runs-on: ubuntu-latest
    # A stuck run fails after 30 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send test email only
        if: ${{ inputs.mode == 'test-email' }}
        working-directory: scripts/legal-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=NY --test-email

      - name: Run New York legal-change check (dry-run)
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node checkCitations.js --state=NY --dry-run --verbose

      - name: Seed baseline state (writes state, never emails)
        if: ${{ inputs.mode == 'seed-baseline' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node checkCitations.js --state=NY --seed-baseline

      - name: Run New York legal-change check
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'check' }}
        working-directory: scripts/legal-watch
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=NY

      - name: Commit updated state, if any
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'seed-baseline' }}
        run: |
          git config user.name "legal-watch-bot"
          git config user.email "actions@github.com"
          git add scripts/legal-watch/state/NY.json
          # Re-checking `git diff --cached --quiet` on a second line to decide
          # whether to push is a bug: by then the commit has already cleared
          # the staged diff, so that check always passes and `push` never
          # runs. One conditional block instead, so push always follows a
          # real commit.
          if ! git diff --cached --quiet; then
            git commit -m "Legal watch (NY): update seen-bill state [skip ci]"
            # Each state writes to its own state/NY.json, so a concurrent
            # push from another state's workflow never touches the same file --
            # but git still rejects a non-fast-forward push if main moved in
            # the meantime (confirmed in practice: seeding all six new states
            # at once, only the first push landed, the other five failed here).
            # Retry with a rebase rather than assuming these jobs never overlap.
            attempt=1
            until git push; do
              if [ "$attempt" -ge 5 ]; then
                echo "git push failed after $attempt attempts, giving up"
                exit 1
              fi
              echo "push rejected (attempt $attempt), fetching and rebasing before retry..."
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
              sleep $((RANDOM % 10 + 1))
            done
          else
            echo "No state changes to commit."
          fi

      # GitHub's own failure emails are off; this sends the notice to the alert
      # address instead (2026-09-29). Manual dry-runs don't send one.
      - name: Email a failure notice
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'seed-baseline') }}
        working-directory: scripts/legal-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: node checkCitations.js --state=NY --notify-failure
